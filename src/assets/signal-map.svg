<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Abstract deployment signal map</title>
  <desc id="desc">A layered technical map with routes, nodes, and deployment markers.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".58" stop-color="#eaf7f3"/>
      <stop offset="1" stop-color="#f9e6dc"/>
    </linearGradient>
    <linearGradient id="route" x1="80" x2="880" y1="620" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121212"/>
      <stop offset=".44" stop-color="#0f8f83"/>
      <stop offset="1" stop-color="#e6402f"/>
